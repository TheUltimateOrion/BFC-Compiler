name: Tag version change

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  actions: write
  contents: write

concurrency:
  group: version-release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag VERSION
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release tag
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          VERSION_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && git diff --quiet "$BEFORE_SHA" "$VERSION_COMMIT" -- VERSION; then
            echo "VERSION did not change in this push; nothing to tag."
            exit 0
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "error: VERSION is not a valid semantic version: $version" >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$tag"; then
            echo "error: tag $tag already exists" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" "$VERSION_COMMIT" --message "Release $tag"
          git push origin "$tag"

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$tag" \
            --field tag="$tag"