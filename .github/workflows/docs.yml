name: Publish Doxygen

on:
  push:
    branches:
      - main
    paths:
      - "include/**"
      - "src/**"
      - "docs/**"
      - "Doxyfile"
      - "Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Doxygen 1.17.0
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install --yes graphviz

          curl --fail --location --remote-name \
            https://www.doxygen.nl/files/doxygen-1.17.0.linux.bin.tar.gz

          echo \
            "75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2  doxygen-1.17.0.linux.bin.tar.gz" \
            | sha256sum --check -

          tar -xzf doxygen-1.17.0.linux.bin.tar.gz

          sudo install \
            doxygen-1.17.0/bin/doxygen \
            /usr/local/bin/doxygen

          doxygen --version

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Doxygen documentation
        run: make docs

      - name: Verify documentation output
        run: test -f docs/doxygen/html/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/doxygen/html

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
